name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (instalación, build y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm se obtiene con corepack: la versión exacta está en "packageManager".
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Ejecuta las pruebas y exige el umbral de cobertura (70 %) en src/auth.
      - run: pnpm run test:cov:auth
        env:
          # Valores solo para pruebas; las unitarias no usan base de datos.
          JWT_SECRET: ci-jwt-secret-no-usar-en-produccion
          CSRF_SECRET: ci-csrf-secret-no-usar-en-produccion

  frontend:
    name: Frontend (instalación, build, pruebas y lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

  e2e:
    name: E2E del Backend (PostgreSQL 17)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores solo para pruebas.
      STAGE: dev
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: shop_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-jwt-secret-no-usar-en-produccion
      CSRF_SECRET: ci-csrf-secret-no-usar-en-produccion
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
